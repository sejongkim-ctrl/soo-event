<head>
    <meta charset="UTF-8">

    <title>THE SOO : 이벤트 응모</title>
    <meta property="og:type" content="website">
    <meta property="og:title" content="2026 새해 관상 테스트">
    <meta property="og:description" content="올해 나의 '한방' 운세를 지금 바로 확인해보세요!">
    <meta property="og:image" content="https://sejongkim-ctrl.github.io/soo-event/images/thumbnail.png">

    <style>
        /* [스타일 통합] */

        /* 1. 기본 배경 및 폰트 */
        body { margin: 0; padding: 0; background: #F9F9F9; font-family: 'Noto Sans KR', sans-serif; color: #333; }
        .container { max-width: 480px; margin: 0 auto; background: #F9F9F9; min-height: 100vh; padding: 20px; box-sizing: border-box; }
        
        /* 2. 헤더 */
        .page-header { text-align: center; margin-bottom: 30px; padding-top: 20px; }
        .brand-logo { color: #82181C; font-family: 'Noto Serif KR', serif; font-size: 16px; letter-spacing: 2px; border-bottom: 1px solid #C5A059; padding-bottom: 5px; font-weight: 700; }

        /* 3. 콘텐츠 박스 */
        .content-box {
            background: 
                url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADIAAAAyCAMAAAAp4XiDAAAAUVBMVEWFhYWDg4N3d3dtbW17e3t1dXV0dHR4eHh2dnZ6enp8fHx5eXl9fX1xcXF/f39vb29wcHBubm5+fn5zc3NtbW1xcXFwcHBtbW1ubm5tbW0zWK9EAAAAG3RSTlNAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEAvOIaxAAAAHklEQVR4XqWXCWoAAAhC3/9/bR8UY52gZStTq/EC4wAPhTE3rgAAAABJRU5ErkJggg=="),
                radial-gradient(circle at 10% 20%, rgba(255, 215, 0, 0.2) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(255, 215, 0, 0.2) 0%, transparent 20%),
                linear-gradient(135deg, #460002 0%, #82181C 50%, #3d0507 100%);
            background-repeat: repeat, no-repeat, no-repeat, no-repeat;
            background-blend-mode: soft-light, normal, normal, normal;
            
            padding: 30px 20px;
            text-align: center;
            border-radius: 16px;
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
            color: #fff; 
            border: 1px solid #C5A059;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        /* 4. 내부 텍스트 스타일 */
        .title-serif { font-family: 'Noto Serif KR', serif; font-size: 22px; font-weight: 700; color: #FFD700; margin: 0 0 20px 0; }
        .step-num { color: #FFD700; font-weight: 700; display: block; margin-bottom: 5px; }
        .step-title { color: #fff; font-size: 18px; font-weight: 700; display: block; margin-bottom: 20px; }
        .highlight-txt { color: #FFD700; font-weight: 700; background: rgba(255, 215, 0, 0.1); padding: 0 4px; border-radius: 4px; }
        .sub-title { font-size: 12px; color: rgba(255,255,255,0.7); font-weight: 700; margin-bottom: 5px; }
        .main-title { font-family: 'Noto Serif KR', serif; font-size: 20px; color: #fff; margin: 0 0 20px 0; }

        /* 5. 약관 & 폼 */
        .agreement-box { background: rgba(255,255,255,0.1); padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); margin-bottom: 15px; }
        .agree-scroll-box { height: 150px; overflow-y: scroll; background: #fff; color: #333; padding: 15px; border-radius: 6px; text-align: left; font-size: 12px; line-height: 1.6; }
        .agree-scroll-box h4 { font-size: 14px; color: #333; margin-bottom: 10px; }
        .agree-scroll-box h5 { font-size: 13px; color: #333; margin: 15px 0 5px 0; }
        .agree-list { margin: 0; padding-left: 15px; list-style-type: disc; }
        .agree-list li { margin-bottom: 4px; }
        
        .radio-group { display: flex; gap: 8px; width: 100%; margin-top: 10px; }
        .radio-label { flex: 1; padding: 12px 0; border: 1px solid #ddd; border-radius: 8px; text-align: center; font-size: 12px; cursor: pointer; background: #fff; color: #333; transition: all 0.2s; display: block; }
        input[type="radio"] { display: none; }
        input[type="radio"]:checked + .radio-label { border-color: #82181C; background: #FFF5F5; color: #82181C; font-weight: 700; box-shadow: 0 0 0 1px #82181C; }

        .input-group { margin-bottom: 15px; text-align: left; }
        .input-label { font-size: 13px; font-weight: 700; display: block; margin-bottom: 6px; color: #fff; }
        .input-field { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 14px; background: #fff; color: #333; box-sizing: border-box; }

        /* 6. 제품 이미지 프레임 */
        .product-stage {
            position: relative;
            margin: 0 auto 15px;
            width: 100%;
            max-width: 280px; 
            border-radius: 20px;
            border: 2px solid rgba(255,215,0,0.5);
            overflow: hidden;
            background: #fff;
            cursor: pointer;
        }
        .product-img { width: 100%; display: block; }

        /* 7. CTA 버튼 */
        .btn-rotating-border {
            position: relative;
            width: 100%;
            margin-top: 20px;
            background: #82181C; 
            color: #fff !important;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            padding: 18px 0;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            z-index: 1; overflow: hidden;
        }
        .btn-rotating-border::before {
            content: ''; position: absolute; z-index: -2; left: -50%; top: -50%; width: 200%; height: 200%;
            background: conic-gradient(transparent, rgba(255, 215, 0, 0.5), #fff, rgba(255, 215, 0, 0.5), transparent 30%);
            animation: rotate-border 4s linear infinite;
        }
        .btn-rotating-border::after {
            content: ''; position: absolute; z-index: -1; left: 3px; top: 3px; right: 3px; bottom: 3px;
            background: linear-gradient(135deg, #9E2A2F 0%, #82181C 100%);
            border-radius: 48px;
        }
        @keyframes rotate-border { 100% { transform: rotate(360deg); } }

        /* 8. 스크롤 가이드 버튼 (줄바꿈 방지) */
