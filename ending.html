<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE SOO : 이벤트 응모</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* (기존 CSS 스타일 동일하므로 생략 - 그대로 유지하세요) */
        body { margin: 0; padding: 0; background: #3d0e10; font-family: 'Noto Sans KR', sans-serif; }
        .container { max-width: 480px; margin: 0 auto; background: #3d0e10; min-height: 100vh; padding: 20px; box-sizing: border-box; }
        .page-header { text-align: center; margin-bottom: 30px; padding-top: 20px; }
        .brand-logo { color: #fff; font-family: 'Noto Serif KR', serif; font-size: 14px; letter-spacing: 2px; border-bottom: 1px solid #C5A059; padding-bottom: 5px; }
        .content-box { background: #fff; padding: 30px 20px; border-radius: 16px; text-align: left; margin-bottom: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .title-serif { font-family: 'Noto Serif KR', serif; color: #82181C; text-align: center; line-height: 1.4; font-weight: 700; }
        .agreement-box { background: #F9F9F9; padding: 10px; border-radius: 8px; border: 1px solid #eee; margin-bottom: 15px; }
        .agree-scroll-box { height: 150px; overflow-y: scroll; background: #fff; border: 1px solid #ddd; padding: 15px; font-size: 12px; color: #555; line-height: 1.6; border-radius: 6px; text-align: left; -webkit-overflow-scrolling: touch; }
        .radio-group { display: flex; gap: 8px; width: 100%; box-sizing: border-box; }
        .radio-label { flex: 1; padding: 14px 0; border: 1px solid #ddd; border-radius: 8px; text-align: center; font-size: 12px; cursor: pointer; background: #fff; transition: all 0.2s; display: block; }
        input[type="radio"] { display: none; }
        input[type="radio"]:checked + .radio-label { border-color: #82181C; background: #FFF5F5; color: #82181C; font-weight: 700; box-shadow: 0 0 0 1px #82181C; }
        .input-group { margin-bottom: 15px; }
        .input-label { font-size: 13px; font-weight: 700; display: block; margin-bottom: 6px; color: #333; }
        .input-field { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
        .product-mini { position: relative; border: 2px solid #EAEAEA; background: #fff; display: flex; align-items: center; gap: 15px; padding: 15px; border-radius: 12px; animation: gentlePulse 2s infinite; }
        .chance-badge { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); background: #FF4B4B; color: #fff; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 800; z-index: 10; }
        @keyframes gentlePulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
        .mini-img { width: 80px; height: 80px; border-radius: 8px; object-fit: cover; }
        .btn-golden { width: 100%; background: linear-gradient(to right, #D4AF70, #F2D69D, #D4AF70); color: #1a1a1a; font-weight: 800; border: none; border-radius: 50px; padding: 18px 0; font-size: 18px; cursor: pointer; margin-top: 30px; }
        footer { text-align: center; color: rgba(255,255,255,0.4); font-size: 11px; padding-bottom: 40px; }
    </style>
</head>
<body>
    <script>
        // [수정] 자바스크립트 최상단에 변수 선언
        let currentUserPhone = ""; 
    </script>

    <div class="container">
        <header class="page-header"><span class="brand-logo">THE SOO</span></header>
        <form id="submit-form" class="content-box">
             <button type="button" class="btn-golden" id="submit-btn" onclick="handleSubmit()">응모 완료하기</button>
        </form>
    </div>
    
    <script src="https://developers.kakao.com/sdk/js/kakao.js"></script>
    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>

    <script>
        // 1. 초기 설정
        const scriptURL = "https://script.google.com/macros/s/AKfycbxtUr98kgj0ESrLllOtKicZVoiHeC8OfoWCiEyWlDSga8KyalnmibUKE_cBFy7kkUqK2A/exec"; 
        const productLink = "https://thesoo.co/promotion/26seol"; 
        
        // 카카오 초기화 (본인의 키를 사용하세요)
        if (!Kakao.isInitialized()) Kakao.init('YOUR_KAKAO_JAVASCRIPT_KEY');

        function execDaumPostcode() { /* 주소검색 로직 동일 */ }
        function trackClickAndGo() { /* 클릭추적 로직 동일 */ }

        // 2. 응모 제출 함수
        function handleSubmit() {
            const form = document.getElementById('submit-form');
            const btn = document.getElementById('submit-btn');

            // 필수값 체크 (생략 - 기존 로직 유지)
            
            btn.innerHTML = "접수 중입니다...";
            btn.disabled = true;

            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());

            fetch(scriptURL, { 
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify(data)
            })
            .then(() => {
                // [수정] 성공 시 번호 저장 및 모달 호출
                currentUserPhone = data.phone; 
                showShareModal(); 
            })
            .catch(error => {
                // [수정] 실패 시에도 모달 호출 (데이터 적재 가능성 고려)
                currentUserPhone = data.phone;
                showShareModal();
                console.error('Error:', error.message);
            });
        }

        // 3. [추가] 모달 표시 함수
        function showShareModal() {
            const modalHtml = `
                <div id="share-modal" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:9999; display:flex; align-items:center; justify-content:center; padding:20px;">
                    <div style="background:#fff; padding:30px; border-radius:16px; text-align:center; width:100%; max-width:320px;">
                        <h3 style="margin-bottom:15px; color:#82181C;">🎉 응모 완료!</h3>
                        <p style="font-size:14px; color:#666; line-height:1.6;">결과가 만족스러우셨나요?<br><b>친구에게 공유</b>하고 당첨 확률을 높여보세요!</p>
                        <button onclick="shareAndTrack()" style="background:#FEE500; color:#3C1E1E; border:none; width:100%; padding:15px; border-radius:8px; font-weight:700; margin-top:20px; cursor:pointer;">
                            💬 카카오톡으로 공유하기
                        </button>
                        <button onclick="location.reload()" style="background:none; border:none; color:#999; margin-top:15px; font-size:12px; text-decoration:underline; cursor:pointer;">그냥 닫기</button>
                    </div>
                </div>`;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
        }

        // 4. [추가] 공유 및 구글 시트 전송 함수
        function shareAndTrack() {
            // 카카오 공유
            Kakao.Link.sendDefault({
                objectType: 'feed',
                content: {
                    title: "2026 '한 방' 테스트",
                    description: "내 관상에 맞는 처방은?",
                    imageUrl: "https://thesoo.co/images/share.jpg",
                    link: { mobileWebUrl: 'https://simte.xyz/thesoo', webUrl: 'https://simte.xyz/thesoo' }
                }
            });

            // 트래킹 전송
            if (currentUserPhone) {
                fetch(scriptURL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({ action: "track_share", phone: currentUserPhone })
                }).then(() => {
                    alert("공유 완료! 당첨 확률 UP!");
                    location.reload();
                });
            }
        }
    </script>
</body>
</html>
