<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE SOO : 한 방 테스트</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <span class="brand-logo">THE SOO</span>
        </header>

        <div class="content-box">
            <div class="result-badge">'한 방' 테스트 결과</div>
            
            <div class="frame-wrapper">
                <div class="img-frame">
                    <img id="result-img" src="" alt="결과 이미지">
                </div>
            </div>
            
            <div id="result-desc" class="result-text-box">
                당신의 2026년 에너지를 분석하고 있습니다.
            </div>
            
            <div onclick="document.getElementById('event-section').scrollIntoView({ behavior: 'smooth' });" class="scroll-guide-btn">
                ▼ 아래 내용 확인하고, 이벤트 응모하기 ▼
            </div>
        </div>

        <section id="event-section" class="content-box">
            <div style="margin-bottom: 20px;">
                <span class="gold-txt">EVENT</span>
                <h3 style="color:#fff; font-size:20px; margin:5px 0 0 0;">매주 '수요일'<br>순금 1돈🥇 증정</h3>
            </div>

            <div class="event-info-container">
                <div class="event-row">
                    <span class="info-badge">📅 참여 기간</span>
                    <span class="info-text">
                        1주차 : 1/14 - 1/20<br>
                        2주차 : 1/21 - 1/27<br>
                        3주차 : 1/28 - 2/3<br>
                        4주차 : 2/4 - 2/10
                    </span>
                </div>
                
                <div class="event-row">
                    <span class="info-badge">📢 당첨 고지</span>
                    <span class="info-text">매주 수요일 18:00시 당첨자 개별 고지</span>
                </div>
                
                <div class="event-row">
                    <span class="info-badge">📝 참여 방법</span>
                    <span class="info-text">아래 버튼을 클릭하여 플러스친구 추가 시,<br>응모페이지가 공유됩니다.</span>
                </div>
            </div>

            <button class="btn-rotating-border" onclick="goToEventPage()">
                이벤트 응모하러 가기
            </button>
        </section>

        <footer>
            <p>© 2026 SOO BRAND. All rights reserved.</p>
        </footer>
    </div>
    
    <script src="script.js"></script>
<script>
        // [수정 2] CTA 클릭 시 카카오톡 채널로 이동
        function goToEventPage() {
            window.open('http://pf.kakao.com/_JReVG/friend', '_blank');
        }
    </script>
</body>
</html>
